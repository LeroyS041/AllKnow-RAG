# Ingress for backend API with SSL
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: AllKnow-ingress
  namespace: AllKnow
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/cors-enable: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
spec:
  tls:
  - hosts:
    - api.AllKnow.my-domain.com  # Placeholder
    secretName: AllKnow-tls
  rules:
  - host: api.AllKnow.my-domain.com  # Placeholder
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: AllKnow-backend
            port:
              number: 80
